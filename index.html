<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#c2410c" />
    <title>다원 소개소</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <!-- 위쪽 제목줄 -->
    <header class="top">
      <button id="back" class="back" type="button" aria-label="뒤로" hidden>‹</button>
      <h1 id="title">다원 소개소</h1>
    </header>

    <!-- 화면 내용이 여기에 그려짐 -->
    <main id="screen"></main>

    <!-- 아래쪽 메뉴 -->
    <nav class="tabbar" aria-label="메뉴">
      <button type="button" data-tab="home"><span aria-hidden="true">🏠</span>홈</button>
      <button type="button" data-tab="jobs"><span aria-hidden="true">📋</span>일감</button>
      <button type="button" data-tab="people"><span aria-hidden="true">👥</span>사람</button>
      <button type="button" data-tab="scripts"><span aria-hidden="true">💬</span>문자</button>
      <button type="button" data-tab="more"><span aria-hidden="true">💾</span>백업</button>
    </nav>

    <!-- 입력창(아래에서 올라오는 창) -->
    <dialog id="sheet"><form id="sheet-form" novalidate></form></dialog>

    <div id="toast" role="status" aria-live="polite"></div>
    <input id="import-file" type="file" accept="application/json,.json" hidden />
  </body>
</html>
